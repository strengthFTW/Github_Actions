name: ci-workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci-workflow_test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup python environment
        uses: actions/setup-python@v5
        with: 
          python-version: '3.11'

      - name: install dependencies
        run: | 
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: run testcase
        run: pytest

      - name: run flake*
        run : flake8 .